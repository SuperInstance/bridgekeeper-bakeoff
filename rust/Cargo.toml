[package]
name = "bridgekeeper"
version = "0.1.0"
edition = "2021"

# Zero dependencies on purpose: see NOTES.md. The whole daemon is
# std::net + threads, so the build is one rustc pass, works offline,
# and there is no supply chain between this file and the binary.

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"   # required: handler isolation relies on catch_unwind
